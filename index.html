<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header>
        <h1>EMPLOYEE MANAGEMENT SYSTEM</h1>
        <div class="date-time">
            <p id="today"></p>
            <p id="time"></p>
        </div>
    </header>

    <main>
        <!-- Search Section -->
        <section class="search-section">
            <input type="text" id="searchInput" placeholder="Search Employee...">
            <button id="searchBtn">Search</button>
        </section>

        <!-- Department Filter -->
        <section class="filter-section">
            <button class="filter-btn active" data-department="All">All</button>
            <button class="filter-btn" data-department="IT">IT</button>
            <button class="filter-btn" data-department="HR">HR</button>
            <button class="filter-btn" data-department="Finance">Finance</button>
            <button class="filter-btn" data-department="Marketing">Marketing</button>
        </section>

        <!-- Status -->
        <p id="status"></p>

        <!-- Dashboard Statistics -->
        <section class="dashboard">
            <div class="stat-card">
                <h3>Total Employees</h3>
                <p id="employeeCount">0</p>
            </div>

            <div class="stat-card">
                <h3>Total Salary</h3>
                <p id="totalSalary">₹0</p>
            </div>

            <div class="stat-card">
                <h3>Average Salary</h3>
                <p id="averageSalary">₹0</p>
            </div>

            <div class="stat-card">
                <h3>Highest Salary</h3>
                <p id="highestSalary">₹0</p>
            </div>
        </section>

        <!-- Highest Paid Employee -->
        <section class="highest-section">
            <h2>Highest Paid Employee</h2>

            <div id="highestEmployee">
                No employee available
            </div>
        </section>

        <!-- Sorting -->
        <section class="sort-section">
            <label for="sortSelect">Sort Employees:</label>

            <select id="sortSelect">
                <option value="default">Default</option>
                <option value="nameAsc">Name ↑</option>
                <option value="nameDesc">Name ↓</option>
                <option value="ageAsc">Age ↑</option>
                <option value="ageDesc">Age ↓</option>
                <option value="salaryAsc">Salary ↑</option>
                <option value="salaryDesc">Salary ↓</option>
            </select>
        </section>

        <!-- Employee Cards -->
        <section>
            <h2 class="section-title">Employees</h2>
            <div id="employeeContainer" class="employee-container"></div>
        </section>

        <!-- Add Employee -->
        <section class="add-section">
            <h2>ADD EMPLOYEE</h2>

            <form id="employeeForm">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="name" placeholder="Enter employee name">
                    <small id="nameError"></small>
                </div>

                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="age" placeholder="Enter age">
                    <small id="ageError"></small>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter email">
                    <small id="emailError"></small>
                </div>

                <div class="form-group">
                    <label>Department</label>
                    <select id="department">
                        <option value="">Select Department</option>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Finance">Finance</option>
                        <option value="Marketing">Marketing</option>
                    </select>
                    <small id="departmentError"></small>
                </div>

                <div class="form-group">
                    <label>Salary</label>
                    <input type="number" id="salary" placeholder="Enter salary">
                    <small id="salaryError"></small>
                </div>

                <button type="submit" class="add-btn">Add Employee</button>
            </form>
        </section>
    </main>


    <script src="./script.js"></script>

</body>

</html>
